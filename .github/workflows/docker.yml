# Publishes the image to GHCR on every version tag: ghcr.io/spyrosbazios/drawer (the server, the web app, OpenSCAD with
# BOSL2 and MCAD) for amd64 and arm64, tagged <version> and latest. The agent runner is not in it: it runs on a host,
# with that host's provider login (agent/README.md).
# Run by hand (workflow_dispatch) it builds both platforms and pushes nothing: a check before a tag, which cannot be moved.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/spyrosbazios/drawer
          tags: |
            type=semver,pattern={{version}}
      # `latest` comes with a release tag by metadata-action's default (a pre-release, v0.2.0-rc.1, does not get it).
      # Only the OpenSCAD stage is emulated for arm64; the web build and the dependency install run natively.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DRAWER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
